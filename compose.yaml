
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsphere-api-docker
    ports:
      - "5005:5000"
    environment:
      AUTH_SERVICE_URL: http://host.docker.internal:5002
      PRODUCT_SERVICE_URL: http://host.docker.internal:5001
      ORDER_SERVICE_URL: http://host.docker.internal:5003
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsphere-frontend-docker
    ports:
      - "8080:80"
    restart: unless-stopped

