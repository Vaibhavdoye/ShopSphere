
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopsphere-backend
  template:
    metadata:
      labels:
        app: shopsphere-backend
    spec:
      containers:
        - name: backend
          image: enterprise-ecommerce-project-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: shopsphere-backend
spec:
  selector:
    app: shopsphere-backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopsphere-frontend
  template:
    metadata:
      labels:
        app: shopsphere-frontend
    spec:
      containers:
        - name: frontend
          image: enterprise-ecommerce-project-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shopsphere-frontend
spec:
  selector:
    app: shopsphere-frontend
  ports:
    - port: 80
      targetPort: 80
