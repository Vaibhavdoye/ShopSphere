apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopsphere-auth
  template:
    metadata:
      labels:
        app: shopsphere-auth
    spec:
      containers:
        - name: auth-service
          image: shopsphere-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          envFrom:
            - secretRef:
                name: shopsphere-secrets
          env:
            - name: AUTH_PORT
              value: "5002"
            - name: DB_HOST
              value: host.docker.internal
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shopsphere-auth
spec:
  selector:
    app: shopsphere-auth
  ports:
    - port: 5002
      targetPort: 5002
---
